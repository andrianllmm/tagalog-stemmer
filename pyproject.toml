[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tglstemmer"
version = "0.1.1"
description = "A library for Tagalog word stemming."
readme = "README.md"
license = "MIT"
authors = [
  {name = "Andrian Lloyd Maagma", email = "maagmaandrian@gmail.com"}
]
keywords = ["Stemming", "Stemmer", "Affix Removal", "Tagalog", "Filipino"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Text Processing :: Linguistic",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"

dependencies = [
  "nltk>=3.8.1",
  "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.5",
    "git-cliff>=2.13.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "twine>=5.1.1",
    "ty>=0.0.64",
]

[project.urls]
homepage = "https://github.com/andrianllmm/tagalog-stemmer"
repository = "https://github.com/andrianllmm/tagalog-stemmer"
issues = "https://github.com/andrianllmm/tagalog-stemmer/issues"

[tool.setuptools]
package-data = {"tglstemmer" = ["resources/*.txt", "resources/affixes/*.txt"]}

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

